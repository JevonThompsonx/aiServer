# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compose · validate
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: |
          # compose files often reference env_file: .env, which is not
          # committed; an empty placeholder keeps `config` valid.
          [ -f .env ] || touch .env
          docker compose -f docker-compose.yml config --quiet
